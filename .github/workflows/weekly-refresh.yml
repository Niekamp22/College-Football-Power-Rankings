name: Weekly data refresh

on:
  schedule:
    # 10:00 AM Eastern during daylight time, 9:00 AM during standard time.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SEASON: "2026"
      BACKTEST_SEASON: "2025"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify required API secrets
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          test -n "$CFBD_API_KEY" || { echo "CFBD_API_KEY repository secret is missing"; exit 1; }
          test -n "$ODDS_API_KEY" || { echo "ODDS_API_KEY repository secret is missing"; exit 1; }

      - name: Run automated tests
        run: python -m unittest discover -p "test*.py" -q

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh public Streamlit outputs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p output/logs
          set -o pipefail
          python refresh_public_app.py \
            --ratings-year "$SEASON" \
            --projection-year "$SEASON" \
            --backtest-year "$BACKTEST_SEASON" \
            --skip-tests \
            --push 2>&1 | tee output/logs/weekly-refresh.log

      - name: Publish refresh summary
        if: always()
        run: |
          if [ -f output/refresh_status.json ]; then
            python render_refresh_summary.py >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Weekly model refresh" >> "$GITHUB_STEP_SUMMARY"
            echo "No validation report was produced. Inspect the refresh log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-diagnostics
          path: |
            output/logs/weekly-refresh.log
            output/refresh_status.json
          if-no-files-found: warn
          retention-days: 30
