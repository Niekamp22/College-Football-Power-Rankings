name: Pipeline safety check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "*.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "*.py"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: pipeline-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -p "test*.py" -q

      - name: Validate current public outputs
        run: python validate_public_outputs.py --season 2026 --output /tmp/refresh_status.json

      - name: Smoke-test Streamlit render
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=30).run()
          if app.exception:
              raise SystemExit(str(app.exception[0].value))
          print(f"Rendered {len(app.tabs)} tabs with no app exceptions")
          PY
